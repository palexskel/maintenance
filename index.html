<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DELA | Tijdelijk niet beschikbaar</title>
<link rel="icon" type="image/png" href="https://info.dela.be/images/Dela/mailtemplate/lgo_dela.png">
<meta name="description" content="De websites van DELA zijn tijdelijk niet beschikbaar wegens gepland technisch onderhoud.">
<style>
:root{
--blue:#007f9f;
--blue-dark:#00677f;
--blue-deep:#004f63;
--blue-light:#e8f5f7;
--orange:#e99b16;
--orange-dark:#d58b0e;
--orange-light:#fff4dc;
--purple:#74436f;
--white:#fff;
--bg:#f3f7f8;
--text:#3e4547;
--muted:#667174;
--border:#dce4e5;
--r8:8px;
--r16:16px;
--r24:24px;
--r28:28px;
--shadow:0 3px 12px rgba(0,71,89,.06)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
font-size:16px;
line-height:1.55;
-webkit-font-smoothing:antialiased
}
button,input,a{font:inherit}
a{color:var(--blue)}
a:hover{color:var(--blue-dark)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{
outline:3px solid var(--orange);
outline-offset:3px
}
.container{
width:min(calc(100% - 40px),1180px);
margin:auto
}
.utility-bar{
background:var(--blue-deep);
color:var(--white);
font-size:14px
}
.utility-inner{
min-height:42px;
display:flex;
align-items:center;
justify-content:flex-end;
gap:30px
}
.utility-item strong{margin-left:5px}
.header{
background:var(--white);
border-bottom:1px solid var(--border)
}
.header-inner{
min-height:82px;
display:flex;
align-items:center;
justify-content:space-between;
gap:30px
}
.logo{
display:inline-flex;
align-items:center
}
.logo img{
display:block;
width:112px;
height:auto
}
.languages{
display:flex;
gap:4px;
padding:4px;
background:var(--blue-light);
border-radius:999px
}
.languages button{
min-width:44px;
min-height:38px;
padding:8px 12px;
border:0;
border-radius:999px;
background:transparent;
color:var(--muted);
cursor:pointer;
font-weight:600
}
.languages button[aria-pressed="true"]{
background:var(--white);
color:var(--blue);
box-shadow:0 1px 5px rgba(0,71,89,.12)
}
main{padding:42px 0 72px}
.hero{
background:var(--blue-light);
border-radius:var(--r28);
box-shadow:var(--shadow);
overflow:hidden
}
.hero-inner{
/*max-width:790px;*/
padding:62px 60px 64px
}
.eyebrow{
margin:0 0 15px;
color:var(--blue);
font-size:15px;
font-weight:700
}
.eyebrow:before{
content:"";
display:inline-block;
width:9px;
height:9px;
margin-right:9px;
background:var(--orange);
border-radius:50%
}
h1,h2,h3{
margin-top:0;
color:var(--blue);
font-weight:600
}
h1{
/*max-width:680px;*/
margin-bottom:22px;
font-size:clamp(2.25rem,5vw,3.55rem);
line-height:1.06;
letter-spacing:-.025em
}
h2{
margin-bottom:14px;
font-size:clamp(1.75rem,3vw,2.25rem);
line-height:1.2
}
h3{
margin-bottom:10px;
font-size:1.3rem;
line-height:1.3
}
.lead{
/*max-width:740px;*/
margin:0;
font-size:19px;
line-height:1.6
}
.lead+.lead{margin-top:13px}
.date{
color:var(--blue-deep);
font-weight:700
}
.section{padding-top:56px}
.section-heading{
max-width:740px;
margin-bottom:28px
}
.section-heading p{
margin:0;
color:var(--muted);
font-size:17px
}
.contact-grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:20px
}
.card{
position:relative;
display:flex;
flex-direction:column;
min-height:365px;
padding:32px 28px 28px;
background:var(--white);
border:1px solid var(--border);
border-radius:var(--r24);
box-shadow:var(--shadow);
overflow:hidden
}
.card:before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
height:6px;
background:var(--blue)
}
.card.death:before{background:var(--orange)}
.card.funeral:before{background:var(--purple)}
.card-content{flex:1}
.label{
display:block;
margin-bottom:14px;
color:var(--muted);
font-size:14px;
font-weight:700
}
.card p{margin-top:0}
.phone{
display:inline-block;
margin-top:8px;
color:var(--blue);
font-size:27px;
font-weight:600;
line-height:1.2;
text-decoration:none
}
.phone:hover{text-decoration:underline}
.hours{
margin-top:6px;
color:var(--muted);
font-size:14px
}
.note{
padding:14px 15px;
margin:19px 0 0;
background:var(--orange-light);
border-radius:var(--r16);
font-size:14px;
line-height:1.5
}
.note strong,.callout strong{color:var(--blue-deep)}
.actions{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:12px;
margin-top:24px
}
.button{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:46px;
padding:11px 20px;
border:1px solid transparent;
border-radius:var(--r8);
text-decoration:none;
font-size:15px;
font-weight:600
}
.button.primary{
background:var(--blue);
color:var(--white)
}
.button.primary:hover{
background:var(--blue-dark);
color:var(--white)
}
.button.orange{
background:var(--orange);
color:var(--white)
}
.button.orange:hover{
background:var(--orange-dark);
color:var(--white)
}
.button.outline{
background:var(--white);
border-color:var(--blue);
color:var(--blue)
}
.button.outline:hover{background:var(--blue-light)}
.text-link{
display:inline-flex;
align-items:center;
gap:6px;
font-weight:600;
text-decoration:none
}
.text-link:after{
content:"›";
font-size:21px
}
.text-link:hover{text-decoration:underline}
.funeral-panel{
background:var(--white);
border:1px solid var(--border);
border-radius:var(--r24);
box-shadow:0 8px 28px rgba(0,71,89,.09);
overflow:hidden
}
.funeral-intro{padding:40px}
.funeral-intro p{
max-width:760px;
margin:0
}
.callout-wrap{padding:0 40px 8px}
.callout{
display:flex;
gap:15px;
padding:20px;
background:var(--orange-light);
border-radius:var(--r16)
}
.info{
display:flex;
align-items:center;
justify-content:center;
flex:0 0 30px;
width:30px;
height:30px;
margin-top:1px;
background:var(--orange);
color:var(--white);
border-radius:50%;
font-weight:700
}
.callout p{margin:0}
.accordion-wrap{padding:24px 40px 40px}
details{
background:#f9fbfb;
border:1px solid var(--border);
border-radius:var(--r16);
overflow:hidden
}
summary{
position:relative;
padding:22px 65px 22px 22px;
color:var(--blue);
cursor:pointer;
list-style:none;
font-size:18px;
font-weight:600
}
summary::-webkit-details-marker{display:none}
summary:after{
content:"+";
position:absolute;
top:50%;
right:18px;
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
background:var(--white);
border:1px solid var(--blue);
border-radius:50%;
transform:translateY(-50%);
font-size:21px
}
details[open] summary{
border-bottom:1px solid var(--border)
}
details[open] summary:after{content:"−"}
.locations{
padding:24px 22px 26px;
background:var(--white)
}
.search{
max-width:610px;
margin-bottom:22px
}
.search label{
display:block;
margin-bottom:8px;
font-size:15px;
font-weight:600
}
.search input{
width:100%;
min-height:50px;
padding:11px 15px;
border:1px solid #aab8ba;
border-radius:var(--r8);
background:var(--white);
color:var(--text)
}
.search input:focus{
border-color:var(--blue);
outline:3px solid rgba(0,127,159,.12)
}
.table-scroll{
overflow-x:auto;
border:1px solid var(--border);
border-radius:var(--r16)
}
table{
width:100%;
min-width:800px;
border-collapse:collapse;
background:var(--white)
}
th,td{
padding:15px;
text-align:left;
vertical-align:top;
border-bottom:1px solid var(--border)
}
th{
background:var(--blue-light);
color:var(--blue-deep);
font-size:14px;
font-weight:700
}
tr:last-child td{border-bottom:0}
td{font-size:15px}
td:first-child{
color:var(--blue-deep);
font-weight:600
}
td a{
font-weight:600;
text-decoration:none
}
td a:hover{text-decoration:underline}
.placeholder{
padding:30px;
color:var(--muted);
text-align:center
}
.careers{
display:grid;
grid-template-columns:1fr auto;
align-items:center;
gap:35px;
padding:40px;
background:var(--blue);
color:var(--white);
border-radius:var(--r24);
box-shadow:var(--shadow)
}
.careers h2{
margin-bottom:8px;
color:var(--white)
}
.careers p{
max-width:700px;
margin:0;
color:var(--white)
}
.careers .button{
background:var(--white);
color:var(--blue);
border-color:var(--white)
}
.careers .button:hover{
background:var(--orange);
border-color:var(--orange);
color:var(--white)
}
.footer{
min-height:110px;
background:var(--blue-deep)
}
@media(max-width:950px){
.contact-grid{grid-template-columns:1fr}
.card{min-height:auto}
.careers{grid-template-columns:1fr}
.careers .button{justify-self:start}
}
@media(max-width:680px){
.utility-bar{display:none}
.header-inner{min-height:70px}
.logo img{width:96px}
main{padding-top:24px}
.hero{border-radius:20px}
.hero-inner{padding:42px 24px 46px}
.lead{font-size:17px}
.section{padding-top:42px}
.card{padding:28px 22px 24px;border-radius:20px}
.funeral-panel{border-radius:20px}
.funeral-intro{padding:28px 22px 20px}
.callout-wrap{padding:0 22px 4px}
.callout{padding:17px}
.accordion-wrap{padding:20px 22px 24px}
.locations{padding:20px 16px}
.careers{padding:30px 22px;border-radius:20px}
.footer{min-height:80px}
}
</style>
</head>

<div class="utility-bar">
  <div class="container utility-inner">
    <span class="utility-item"><span data-t="topDeath"></span><strong>078 05 05 78</strong></span>
    <span class="utility-item"><span data-t="topOther"></span><strong>02 800 87 87</strong></span>
  </div>
</div>

<header class="header">

      <img

      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </nav>

  </div>
</header>

<main>
<div class="container">

<section class="hero">
  <div class="hero-inner">
    <p class="eyebrow" data-t="maintenance"></p>

    <h1 data-t="heroTitle"></h1>

    <p class="lead">
      <span data-t="heroBeforeDate"></span>
      <span class="date" data-t="date"></span>
      <span data-t="heroAfterDate"></span>
    </p>

    <p class="lead" data-t="heroHelp"></p>
  </div>
</section>

<section class="section">

  <div class="section-heading">
    <h2 data-t="helpTitle"></h2>
    <p data-t="helpText"></p>
  </div>

  <div class="contact-grid">

    <article class="card death">
      <div class="card-content">

        <span class="label" data-t="deathLabel"></span>

        <h3 data-t="deathTitle"></h3>

        <p data-t="deathText"></p>

        <a class="phone" href="tel:+3278050578">
          078 05 05 78
        </a>

        <div class="hours">
          24 / 7
        </div>

        <div class="note">
          <strong data-t="insuredStrong"></strong>
          <span data-t="insuredText"></span>
        </div>

      </div>

      <div class="actions">
        <a
          href="tel:+3278050578"
          class="button orange"
          data-t="callDela"
        ></a>
      </div>
    </article>


    <article class="card">

      <div class="card-content">

        <span class="label" data-t="customerLabel"></span>

        <h3 data-t="customerTitle"></h3>

        <p data-t="customerText"></p>

        <a class="phone" href="tel:+3228008787">
          02 800 87 87
        </a>

        <div class="hours" data-t="customerHours"></div>

      </div>

      <div class="actions">

        <a
          href="tel:+3228008787"
          class="button primary"
          data-t="callUs"
        ></a>

        <a
          href="mailto:info@dela.be"
          class="text-link"
        >
          info@dela.be
        </a>

      </div>

    </article>


    <article class="card funeral">

      <div class="card-content">

        <span class="label" data-t="funeralLabel"></span>

        <h3 data-t="funeralTitle"></h3>

        <p data-t="funeralText"></p>

        <p>
          <span data-t="funeralEven"></span>
          <strong data-t="funeralNotInsured"></strong>.
        </p>

      </div>

      <div class="actions">

        <a
          href="#uitvaartcentra"
          class="button outline"
          data-t="findFuneral"
        ></a>

      </div>

    </article>

  </div>

</section>


<section
  class="section"
  id="uitvaartcentra"
>

  <div class="funeral-panel">

    <div class="funeral-intro">

      <h2 data-t="nearTitle"></h2>

      <p data-t="nearText"></p>

    </div>


    <div class="callout-wrap">

      <div class="callout">

        <span
          class="info"
          aria-hidden="true"
        >
          i
        </span>

        <p>
          <strong data-t="notInsuredStrong"></strong>
          <span data-t="notInsuredText1"></span>
          <strong>078 05 05 78</strong>
          <span data-t="notInsuredText2"></span>
        </p>

      </div>

    </div>


    <div class="accordion-wrap">

      <details>

        <summary data-t="showLocations"></summary>

        <div class="locations">

          <div class="search">

            <label
              for="location-search"
              data-t="searchLabel"
            ></label>

            <input
              id="location-search"
              type="search"
              autocomplete="off"
            >

          </div>


          <div class="table-scroll">

            <table>

              <thead>
                <tr>
                  <th data-t="thName"></th>
                  <th data-t="thAddress"></th>
                  <th data-t="thPhone"></th>
                  <th>E-mail</th>
                </tr>
              </thead>

              <tbody id="location-table">

                <tr id="location-placeholder">
                  <td
                    colspan="4"
                    class="placeholder"
                    data-t="placeholder"
                  ></td>
                </tr>

              </tbody>

            </table>

          </div>

        </div>

      </details>

    </div>

  </div>

</section>


<section class="section">

  <div class="careers">

    <div>

      <h2 data-t="careerTitle"></h2>

      <p data-t="careerText"></p>

    </div>

    <a
      class="button"
      href="https://www.werkenbijdela.be/portal-over-het-bedrijf/vind-je-job"
      target="_blank"
      rel="noopener"
      data-t="careerButton"
    ></a>

  </div>

</section>

</div>
</main>


<footer
  class="footer"
  aria-hidden="true"
></footer>

const locations=[
/*
["DELA Uitvaartzorg Timmermans","Straat 1, 2000 Antwerpen","03 123 45 67","info@voorbeeld.be"]
*/
];

function setLang(lang){
document.documentElement.lang=lang;

document.querySelectorAll("[data-t]").forEach(el=>{
const key=el.dataset.t;
if(t[lang][key]!=null)el.textContent=t[lang][key];
});

document.querySelectorAll("[data-lang]").forEach(b=>{
b.setAttribute(
"aria-pressed",
b.dataset.lang===lang?"true":"false"
);
});

document.getElementById("location-search").placeholder=
t[lang].searchPlaceholder;
}

function renderLocations(filter=""){
const body=document.getElementById("location-table");
const q=filter.trim().toLowerCase();
const lang=document.documentElement.lang;

if(!locations.length){
body.innerHTML=
'<tr><td colspan="4" class="placeholder">'+
t[lang].placeholder+
'</td></tr>';
return;
}

body.innerHTML=locations
.filter(r=>!q||r.join(" ").toLowerCase().includes(q))
.map(r=>`<tr>
<td>${r[0]}</td>
<td>${r[1]}</td>
<td><a href="tel:${r[2].replace(/[^\d+]/g,"")}">${r[2]}</a></td>
<td><a href="mailto:${r[3]}">${r[3]}</a></td>
</tr>`)
.join("");
}

document.querySelectorAll("[data-lang]").forEach(b=>{
b.addEventListener("click",()=>{
setLang(b.dataset.lang);
renderLocations(
document.getElementById("location-search").value
);
});
});

document
.getElementById("location-search")
.addEventListener("input",e=>{
renderLocations(e.target.value);
});

setLang("nl");
renderLocations();
</script>
