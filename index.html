<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
background:#f3f7f8;
color:#3e4547;
font:16px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif
}

a{color:#007f9f}
a:hover{color:#00677f}

button,input,a{font:inherit}

a:focus-visible,
button:focus-visible,
input:focus-visible,
summary:focus-visible{
outline:3px solid #e99b16;
outline-offset:3px
}

.c{
width:min(calc(100% - 40px),1180px);
margin:auto
}

.top{
background:#004f63;
color:#fff;
font-size:14px
}

.top .c{
min-height:42px;
display:flex;
align-items:center;
justify-content:flex-end;
gap:30px
}

.top strong{margin-left:5px}

.head{
background:#fff;
border-bottom:1px solid #dce4e5
}

.head .c{
min-height:82px;
display:flex;
align-items:center;
justify-content:space-between;
gap:30px
}

.logo img{
display:block;
width:112px
}

.langs{
display:flex;
gap:4px;
padding:4px;
background:#e8f5f7;
border-radius:999px
}

.langs button{
min-width:44px;
min-height:38px;
padding:8px 12px;
border:0;
border-radius:999px;
background:none;
color:#667174;
cursor:pointer;
font-weight:600
}

.langs button[aria-pressed=true]{
background:#fff;
color:#007f9f;
box-shadow:0 1px 5px #0047591f
}

main{padding:42px 0 72px}

.hero{
background:#e8f5f7;
border-radius:28px;
box-shadow:0 3px 12px #0047590f;
overflow:hidden
}

.hero>div{
padding:62px 60px 64px
}

.ey{
margin:0 0 15px;
color:#007f9f;
font-size:15px;
font-weight:700
}

.ey:before{
content:"";
display:inline-block;
width:9px;
height:9px;
margin-right:9px;
background:#e99b16;
border-radius:50%
}

h1,h2,h3{
margin-top:0;
color:#007f9f;
font-weight:600
}

h1{
margin-bottom:22px;
font-size:clamp(2.25rem,5vw,3.55rem);
line-height:1.06;
letter-spacing:-.025em
}

h2{
margin-bottom:14px;
font-size:clamp(1.75rem,3vw,2.25rem);
line-height:1.2
}

h3{
margin-bottom:10px;
font-size:1.3rem;
line-height:1.3
}

.lead{
margin:0;
font-size:19px;
line-height:1.6
}

.sec{padding-top:56px}

.intro{
max-width:900px;
margin-bottom:28px
}

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:20px
}

.card{
position:relative;
display:flex;
flex-direction:column;
min-height:365px;
padding:32px 28px 28px;
background:#fff;
border:1px solid #dce4e5;
border-radius:24px;
box-shadow:0 3px 12px #0047590f;
overflow:hidden
}

.card:before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
height:6px;
background:#007f9f
}

.card.d:before{background:#e99b16}
.card.f:before{background:#74436f}

.body{flex:1}

.lab{
display:block;
margin-bottom:14px;
color:#667174;
font-size:14px;
font-weight:700
}

.card p{margin-top:0}

.phone{
display:inline-block;
margin-top:8px;
color:#007f9f;
font-size:27px;
font-weight:600;
line-height:1.2;
text-decoration:none
}

.phone:hover{text-decoration:underline}

.hours{
margin-top:6px;
color:#667174;
font-size:14px
}

.note{
padding:14px 15px;
margin:19px 0 0;
background:#fff4dc;
border-radius:16px;
font-size:14px;
line-height:1.5
}

.note strong{color:#004f63}

.act{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:12px;
margin-top:24px
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:46px;
padding:11px 20px;
border:1px solid transparent;
border-radius:8px;
text-decoration:none;
font-size:15px;
font-weight:600
}

.pri{
background:#007f9f;
color:#fff
}

.org{
background:#e99b16;
color:#fff
}

.mail{
font-weight:600;
text-decoration:none
}

.mail:after{
content:"›";
font-size:21px;
margin-left:6px
}

.panel{
background:#fff;
border:1px solid #dce4e5;
border-radius:24px;
box-shadow:0 8px 28px #00475917;
overflow:hidden
}

.fi{padding:40px}

.fi p{
max-width:760px;
margin:0
}

.map{
margin:0 40px 24px;
overflow:hidden;
border:1px solid #dce4e5;
border-radius:16px
}

.map iframe{
display:block;
width:100%;
height:500px;
border:0
}

.aw{
padding:0 40px 40px
}

details{
background:#f9fbfb;
border:1px solid #dce4e5;
border-radius:16px;
overflow:hidden
}

summary{
position:relative;
padding:22px 65px 22px 22px;
color:#007f9f;
cursor:pointer;
list-style:none;
font-size:18px;
font-weight:600
}

summary::-webkit-details-marker{display:none}

summary:after{
content:"+";
position:absolute;
top:50%;
right:18px;
width:34px;
height:34px;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border:1px solid #007f9f;
border-radius:50%;
transform:translateY(-50%);
font-size:21px
}

details[open] summary{
border-bottom:1px solid #dce4e5
}

details[open] summary:after{
content:"−"
}

.loc{
padding:24px 22px 26px;
background:#fff
}

.search{
max-width:610px;
margin-bottom:22px
}

.search label{
display:block;
margin-bottom:8px;
font-size:15px;
font-weight:600
}

.search input{
width:100%;
min-height:50px;
padding:11px 15px;
border:1px solid #aab8ba;
border-radius:8px;
background:#fff;
color:#3e4547
}

.swipe{
display:none
}

.scroll{
overflow-x:auto;
border:1px solid #dce4e5;
border-radius:16px
}

table{
width:100%;
min-width:680px;
border-collapse:collapse;
background:#fff
}

th,td{
padding:15px;
text-align:left;
vertical-align:top;
border-bottom:1px solid #dce4e5
}

th{
background:#e8f5f7;
color:#004f63;
font-size:14px
}

tr:last-child td{
border-bottom:0
}

td{
font-size:15px
}

td:first-child{
color:#004f63;
font-weight:600
}

td a{
font-weight:600;
text-decoration:none
}

.jobs{
display:grid;
grid-template-columns:1fr auto;
align-items:center;
gap:35px;
padding:40px;
background:#007f9f;
color:#fff;
border-radius:24px;
box-shadow:0 3px 12px #0047590f
}

.jobs h2,
.jobs p{
color:#fff
}

.jobs p{
max-width:700px;
margin:0
}

.jobs .btn{
background:#fff;
color:#007f9f
}

.foot{
min-height:110px;
background:#004f63
}

@media(max-width:950px){
.grid{grid-template-columns:1fr}
.card{min-height:auto}
.jobs{grid-template-columns:1fr}
.jobs .btn{justify-self:start}
.map iframe{height:440px}
}

@media(max-width:680px){
.top{display:none}

.head .c{
min-height:70px
}

.logo img{
width:96px
}

main{
padding-top:24px
}

.hero{
border-radius:20px
}

.hero>div{
padding:42px 24px 46px
}

.lead{
font-size:17px
}

.sec{
padding-top:42px
}

.card{
padding:28px 22px 24px;
border-radius:20px
}

.panel{
border-radius:20px
}

.fi{
padding:28px 22px 20px
}

.map{
margin:0 22px 20px
}

.map iframe{
height:380px
}

.aw{
padding:0 22px 24px
}

.loc{
padding:20px 16px
}

.swipe{
display:block;
margin:0 0 8px;
color:#667174;
text-align:right;
font-size:13px;
font-weight:600
}

.scroll{
box-shadow:inset -12px 0 10px -12px #667174
}

.jobs{
padding:30px 22px;
border-radius:20px
}

.foot{
min-height:80px
}
}
</style>
</head>

<div class="top">
  <div class="c">

    <span>
      <span data-t="topDeath"></span>
      <strong>078 05 05 78</strong>
    </span>

    <span>
      <span data-t="topOther"></span>
      <strong>02 800 87 87</strong>
    </span>

  </div>
</div>

<header class="head">
  <div class="c">

    <div class="logo">
      <img
        src="https://info.dela.be/images/Dela/mailtemplate/lgo_dela.png"
        alt="DELA"
      >
    </div>

    <nav
      class="langs"
      aria-label="Taal / Langue / Language"
    >
      <button data-lang="nl" aria-pressed="true">NL</button>
      <button data-lang="fr" aria-pressed="false">FR</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </nav>

  </div>
</header>

<main>
<div class="c">

  <section class="hero">
    <div>
      <p class="ey" data-t="maintenance"></p>

      <h1 data-t="heroTitle"></h1>

      <p
        class="lead"
        data-t="heroDateText"
      ></p>
    </div>
  </section>

  <section class="sec">

    <div class="intro">
      <h2 data-t="helpTitle"></h2>
    </div>

    <div class="grid">

      <article class="card d">

        <div class="body">

          <span
            class="lab"
            data-t="deathLabel"
          ></span>

          <h3 data-t="deathTitle"></h3>

          <p data-t="deathText"></p>

          <a
            class="phone"
            href="tel:+3278050578"
          >
            078 05 05 78
          </a>

          <div class="hours">
            24 / 7
          </div>

          <div class="note">
            <strong data-t="insuredStrong"></strong>
            <span data-t="insuredText"></span>
          </div>

        </div>

        <div class="act">
          <a
            href="tel:+3278050578"
            class="btn org"
            data-t="callDela"
          ></a>
        </div>

      </article>

      <article class="card f">

        <div class="body">

          <span
            class="lab"
            data-t="funeralLabel"
          ></span>

          <h3 data-t="funeralTitle"></h3>

          <p data-t="funeralText"></p>

          <p>
            <span data-t="funeralEven"></span>
            <strong data-t="funeralNotInsured"></strong>.
          </p>

        </div>

        <div class="act">
          <a
            href="#uitvaartcentra"
            class="btn pri"
            data-t="findFuneral"
          ></a>
        </div>

      </article>

      <article class="card">

        <div class="body">

          <span
            class="lab"
            data-t="customerLabel"
          ></span>

          <h3 data-t="customerTitle"></h3>

          <p data-t="customerText"></p>

          <a
            class="phone"
            href="tel:+3228008787"
          >
            02 800 87 87
          </a>

          <div
            class="hours"
            data-t="customerHours"
          ></div>

        </div>

        <div class="act">

          <a
            href="tel:+3228008787"
            class="btn pri"
            data-t="callUs"
          ></a>

          <a
            href="mailto:info@dela.be"
            class="mail"
          >
            info@dela.be
          </a>

        </div>

      </article>

    </div>

  </section>

  <section
    class="sec"
    id="uitvaartcentra"
  >

    <div class="panel">

      <div class="fi">
        <h2 data-t="nearTitle"></h2>
        <p data-t="nearText"></p>
      </div>

      <div class="map">

        <iframe
          src="https://www.google.com/maps/d/embed?mid=14DKKrt9r9X6SNQWIbZDPHr6fBjt4QBg"
          title="DELA-uitvaartlocaties"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        ></iframe>

      </div>

      <div class="aw">

        <details>

          <summary data-t="showLocations"></summary>

          <div class="loc">

            <div class="search">

              <label
                for="q"
                data-t="searchLabel"
              ></label>

              <input
                id="q"
                type="search"
                autocomplete="off"
              >

            </div>

            <div
              class="swipe"
              data-t="swipeHint"
            ></div>

            <div class="scroll">

              <table>

                <thead>
                  <tr>
                    <th data-t="thName"></th>
                    <th data-t="thAddress"></th>
                    <th data-t="thPhone"></th>
                  </tr>
                </thead>

                <tbody id="rows"></tbody>

              </table>

            </div>

          </div>

        </details>

      </div>

    </div>

  </section>

  <section class="sec">

    <div class="jobs">

      <div>
        <h2 data-t="careerTitle"></h2>
        <p data-t="careerText"></p>
      </div>

      <a
        class="btn"
        href="https://www.werkenbijdela.be/portal-over-het-bedrijf/vind-je-job"
        target="_blank"
        rel="noopener"
        data-t="careerButton"
      ></a>

    </div>

  </section>

</div>
</main>

<footer class="foot"></footer>

function lang(l){
document.documentElement.lang=l;
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[l][e.dataset.t]||"");
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
q.placeholder=t[l].searchPlaceholder
}

function render(s=""){
s=s.trim().toLowerCase();

rows.innerHTML=locations
.filter(r=>!s||r.join(" ").toLowerCase().includes(s))
.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><a href="tel:${r[2].replace(/[^\d+]/g,"")}">${r[2]}</a></td></tr>`)
.join("")
}

document.querySelectorAll("[data-lang]").forEach(
b=>b.onclick=()=>lang(b.dataset.lang)
);

q.oninput=e=>render(e.target.value);

lang("nl");
render();
</script>
